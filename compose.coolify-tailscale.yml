# Single-file version of docker-compose.yml + compose.tailscale.yml, for tools that take one compose
# file (Coolify). Keep it in sync with those two files when they change.
# Set TS_AUTHKEY, ALLOWED_USERS and the four BRICKLINK_* variables in Coolify's Environment Variables tab.
# Optional: REBRICKABLE_API_KEY, BRICKSET_API_KEY, ALERT_WEBHOOK_URL, APP_URL, TZ, SYNC_HOUR (see .env.example).
# Don't assign a domain in Coolify: the app is only reachable at https://<TS_HOSTNAME>.<tailnet>.ts.net
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-brickfolio}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-brickfolio}
      - TS_EXTRA_ARGS=--advertise-tags=${TS_TAG:-tag:brickfolio}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-state:/var/lib/tailscale
    configs:
      - source: serve
        target: /config/serve.json
    restart: unless-stopped

  app:
    # The published image (amd64 and arm64). Pin a release with BRICKFOLIO_IMAGE, e.g.
    # ghcr.io/scoobydrew83/brickfolio:0.2. To build from source instead, replace these two lines with
    #   build: .
    #   pull_policy: build
    image: ${BRICKFOLIO_IMAGE:-ghcr.io/scoobydrew83/brickfolio:latest}
    pull_policy: always
    network_mode: service:tailscale
    depends_on: [tailscale]
    environment:
      - DATABASE_PATH=/data/app.db
      - HOSTNAME=127.0.0.1
      - AUTH_MODE=tailscale
      - ALLOWED_USERS
      - ADMIN_USERS
      - BRICKLINK_CONSUMER_KEY
      - BRICKLINK_CONSUMER_SECRET
      - BRICKLINK_TOKEN
      - BRICKLINK_TOKEN_SECRET
      - REBRICKABLE_API_KEY
      - BRICKSET_API_KEY
      - ALERT_WEBHOOK_URL
      - ALERT_WEBHOOK_FORMAT
      - ALERT_EMAIL_TO
      - ALERT_TELEGRAM_BOT_TOKEN
      - ALERT_TELEGRAM_CHAT_ID
      - ALERT_PUSHOVER_TOKEN
      - ALERT_PUSHOVER_USER
      - ALERT_GOTIFY_URL
      - ALERT_GOTIFY_TOKEN
      - SYNC_ALERT
      - PRICE_SWING_PCT
      - RETIRE_ALERT_DAYS
      - DESIGNER_ALERT_DAYS
      - OFFER_MAX_AGE_DAYS
      # Email for ALERT_EMAIL_TO (Coolify has no .env file, so each variable is listed here).
      - EMAIL_PROVIDER
      - EMAIL_FROM
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_SECURE
      - SMTP_USER
      - SMTP_PASSWORD
      - RESEND_API_KEY
      - POSTMARK_SERVER_TOKEN
      - AWS_SES_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - APP_URL
      - SHARE_BASE_URL
      # Cached set and minifigure photos (share pages, offline scanning), in the data volume.
      - IMAGE_CACHE
      - IMAGE_CACHE_DIR=${IMAGE_CACHE_DIR:-/data/images}
      - IMAGE_CACHE_WARM
      # The LDraw parts library for the 3D view lives in the data volume; download it from Settings.
      - LDRAW_LIBRARY_DIR=${LDRAW_LIBRARY_DIR:-/data/ldraw}
      - LDRAW_LIBRARY_URL
      - TZ
      - SYNC_HOUR
      - BACKUP_KEEP
      - CRON_SECRET
    volumes:
      - data:/data
      - image-cache:/app/.next/cache/images
    restart: unless-stopped

volumes:
  data:
  image-cache:
  tailscale-state:

configs:
  serve:
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": { "$${TS_CERT_DOMAIN}:443": { "Handlers": { "/": { "Proxy": "http://127.0.0.1:3000" } } } },
        "AllowFunnel": { "$${TS_CERT_DOMAIN}:443": false }
      }
