# Lint, test and build on every push to main and every PR.
# No secrets: pages await connection(), so the build never opens the database.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # same as the Dockerfile
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
