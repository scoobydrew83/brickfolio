name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options: [Docker (local only), Docker + Tailscale, Docker + Cloudflare Tunnel, Cloudflare Workers + D1, npm run dev]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or image tag
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs app` or `wrangler tail` output. Remove any keys or tokens."
      render: text
